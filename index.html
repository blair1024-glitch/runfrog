<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="樹蛙「呱踏」騎單車跑酷遊戲">
<title>呱踏騎單車</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
/* layout: one framed scene window, control deck below; chrome stays quiet so the scene carries the page */
:root{
  --bg:#eef2ea; --panel:#ffffff; --fg:#1f2a1c; --muted:#5d6b58; --line:#d3dccc;
  --accent:#3f7f22; --accent-ink:#ffffff; --chip:#e3ecd9; --heart:#d03b3b;
  --font-display:"LXGW WenKai TC","Noto Serif TC",serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111610; --panel:#1a2118; --fg:#e4ecdd; --muted:#9aa892; --line:#2f3a2b;
  --accent:#8fc95a; --accent-ink:#13200b; --chip:#243020; --heart:#ff6b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111610; --panel:#1a2118; --fg:#e4ecdd; --muted:#9aa892; --line:#2f3a2b;
  --accent:#8fc95a; --accent-ink:#13200b; --chip:#243020; --heart:#ff6b6b; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;padding:0 16px}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 40px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,4vw,36px);margin:0;letter-spacing:.02em;text-wrap:balance}
header p{margin:0;color:var(--muted)}
.stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#9fc7e6}
canvas{display:block;width:100%;aspect-ratio:16/9;max-width:100%;cursor:pointer}
.hud{position:absolute;left:14px;top:12px;font:500 13px/1 var(--font-body);color:#fff;background:rgba(10,20,10,.38);padding:7px 10px;border-radius:8px;font-variant-numeric:tabular-nums;pointer-events:none}
.deck{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 22px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
@media (max-width:760px){.deck{grid-template-columns:minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:460px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats b{font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.hearts{color:var(--heart);letter-spacing:.08em}
.overlay[hidden]{display:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,14,8,.45);padding:16px}
.overlay .card{background:var(--panel);color:var(--fg);border-radius:14px;padding:22px 24px;max-width:380px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.overlay h2{font-family:var(--font-display);font-size:28px;margin:0}
.overlay p{margin:0;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:520px){.overlay .card{padding:14px 16px;gap:8px}.overlay h2{font-size:22px}.overlay p{font-size:13px}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.kmh{font-variant-numeric:tabular-nums;font-weight:700;min-width:5.5em;text-align:right}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--fg);font:inherit;padding:7px 10px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-weight:500;padding:9px 16px;border-radius:10px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.keys{color:var(--muted);font-size:13px;margin:0}
kbd{font-family:var(--font-body);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--panel)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>呱踏騎單車</h1>
    <p>跳過路上的石頭和三角錐，伸舌頭吃蒼蠅加分。撞三次就摔車。</p>
  </header>

  <div class="stage">
    <canvas id="scene" aria-label="青蛙騎腳踏車跑酷遊戲，點擊畫面跳躍"></canvas>
    <div class="hud" id="hud">15 km/h · 0 m</div>
    <div class="overlay" id="ov">
      <div class="card">
        <h2 id="ovTitle">準備出發</h2>
        <p id="ovText">按空白鍵或點畫面跳躍，在空中可以再跳一次。越騎越快，木箱堆要用二段跳才過得去。</p>
        <button class="btn primary" id="go">開始騎車</button>
      </div>
    </div>
  </div>

  <div class="deck">
    <div class="stats">
      <div><span class="label">分數</span><b id="sScore">0</b></div>
      <div><span class="label">最高分</span><b id="sBest">0</b></div>
      <div><span class="label">吃到蒼蠅</span><b id="sFly">0</b></div>
      <div><span class="label">生命</span><b id="sLife" class="hearts">♥♥♥</b></div>
    </div>
    <div class="acts">
      <button class="btn" id="pause">暫停</button>
      <button class="btn" id="bell">按車鈴</button>
      <button class="btn primary" id="jump">跳一下</button>
    </div>
  </div>
  <p class="keys"><kbd>空白鍵</kbd> 或 <kbd>↑</kbd> 跳躍（空中可再跳一次）　<kbd>P</kbd> 暫停　<kbd>B</kbd> 車鈴　手機直接點畫面</p>
</div>

<script>
(()=>{
const cv=document.getElementById('scene'),ctx=cv.getContext('2d');
const L=document.createElement('canvas'),lc=L.getContext('2d');
const W=1280,H=720,ROAD=600;
let k=1;
function resize(){const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(r.width*d);cv.height=Math.round(r.width*9/16*d);L.width=cv.width;L.height=cv.height;k=cv.width/W}
window.addEventListener('resize',resize);resize();

/* seeded random */
let seed=7;const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);

/* color helpers */
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>{a=typeof a=='string'?hx(a):a;b=typeof b=='string'?hx(b):b;return a.map((v,i)=>Math.round(v+(b[i]-v)*t))};
const rgb=(c,a=1)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const P=[
 {top:'#3a86cf',bot:'#cfe8f4',tint:[255,255,255],ta:0,cloud:'#ffffff'},
 {top:'#33407e',bot:'#f7a46b',tint:[255,110,40],ta:.2,cloud:'#ffc7a1'},
 {top:'#040818',bot:'#1a2850',tint:[12,22,62],ta:.62,cloud:'#3a4670'}
];
function pal(m){const i=Math.min(1,Math.floor(m)),t=m-i,a=P[i],b=P[Math.min(2,i+1)];
 return{top:mix(a.top,b.top,t),bot:mix(a.bot,b.bot,t),tint:mix(a.tint,b.tint,t),ta:a.ta+(b.ta-a.ta)*t,cloud:mix(a.cloud,b.cloud,t)}}

/* periodic ridge */
function ridge(n,amp,period){const w=[];for(let i=0;i<n;i++)w.push({k:1+Math.floor(rnd()*(4+i*3)),a:amp/(i+1)*(.6+rnd()*.6),p:rnd()*6.28});
 return x=>w.reduce((s,q)=>s+q.a*Math.sin(6.2832*q.k*x/period+q.p),0)}
const far=ridge(5,70,3000),mid=ridge(5,45,2400),hill=ridge(4,18,1800);

/* textures */
function tile(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);return c}
const asphalt=tile(256,128,(g,w,h)=>{g.fillStyle='#46474b';g.fillRect(0,0,w,h);for(let i=0;i<2600;i++){const v=40+rnd()*60;g.fillStyle=`rgba(${v},${v},${v+4},${.25+rnd()*.5})`;g.fillRect(rnd()*w,rnd()*h,1+rnd()*2,1+rnd()*2)}});
const meadow=tile(256,64,(g,w,h)=>{g.fillStyle='#6ea33d';g.fillRect(0,0,w,h);for(let i=0;i<900;i++){const x=rnd()*w,y=rnd()*h,l=3+rnd()*7;g.strokeStyle=`rgba(${60+rnd()*60},${120+rnd()*60},${30+rnd()*30},.7)`;g.lineWidth=1;g.beginPath();g.moveTo(x,y);g.lineTo(x+(rnd()-.5)*3,y-l);g.stroke()}});
let pa,pm;

/* clouds */
const clouds=[];for(let i=0;i<7;i++){const puffs=[];const n=5+Math.floor(rnd()*5);for(let j=0;j<n;j++)puffs.push([j*28-n*14+rnd()*16,(rnd()-.5)*18-Math.sin(j/n*3.14)*18,26+rnd()*26]);clouds.push({x:rnd()*1800,y:60+rnd()*200,s:.6+rnd()*.7,puffs})}
const stars=[];for(let i=0;i<180;i++)stars.push([rnd()*W,rnd()*380,rnd()*1.4+.3,rnd()*6.28]);
const trees=[];for(let i=0;i<60;i++)trees.push({x:rnd()*1800,h:40+rnd()*50,t:rnd()<.55?'pine':'oak',c:rnd()});
const blades=[];for(let i=0;i<120;i++)blades.push({x:rnd()*1600,h:30+rnd()*60,c:rnd(),w:rnd()*6.28});
const flies=[];for(let i=0;i<22;i++)flies.push({x:rnd()*1600,y:520+rnd()*150,p:rnd()*6.28});
const dust=[];

/* state */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let speed=reduce?0:4,dist=0,scroll=0,crank=0,mode=0,modeT=0,jy=0,jv=0,blink=0,nextBlink=2,bellT=0,last=performance.now(),t=0;
const S=1.75,BX=300;
/* game state */
let game='ready',paused=false,meters=0,fliesN=0,lives=3,inv=0,shake=0,slow=0,jumps=0,nextObs=700,nextItem=400,best=0,tongue=null;
const obs=[],items=[],pops=[];
try{best=+localStorage.getItem('guata-best')||0}catch(e){}
const TYPES={rock:{w:62,h:34},cone:{w:36,h:46},log:{w:100,h:30},crate:{w:50,h:50},tower:{w:50,h:100}};
function drawObs(g,o,y){const{w,h}=TYPES[o.type],x=o.x;let gr;
 g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.ellipse(x+w/2,y+3,w*.6,5,0,0,6.29);g.fill();
 if(o.type==='rock'){gr=g.createRadialGradient(x+w*.35,y-h*.75,3,x+w/2,y-h*.4,w*.6);gr.addColorStop(0,'#c9c6bd');gr.addColorStop(.6,'#8a877f');gr.addColorStop(1,'#4c4a45');g.fillStyle=gr;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x-2,y-h*.7,x+w*.3,y-h);g.quadraticCurveTo(x+w*.7,y-h*1.08,x+w,y-h*.4);g.lineTo(x+w,y);g.fill();g.strokeStyle='rgba(40,38,34,.4)';g.lineWidth=1.5;g.beginPath();g.moveTo(x+w*.45,y-h*.95);g.lineTo(x+w*.55,y-h*.5);g.lineTo(x+w*.48,y-h*.2);g.stroke()}
 else if(o.type==='cone'){g.fillStyle='#2d2d30';g.fillRect(x-4,y-6,w+8,6);gr=g.createLinearGradient(x,0,x+w,0);gr.addColorStop(0,'#c94b10');gr.addColorStop(.4,'#ff8a2a');gr.addColorStop(1,'#b8400c');g.fillStyle=gr;g.beginPath();g.moveTo(x+2,y-6);g.lineTo(x+w*.42,y-h);g.lineTo(x+w*.58,y-h);g.lineTo(x+w-2,y-6);g.fill();g.fillStyle='rgba(250,250,245,.95)';[[.32,.46],[.62,.72]].forEach(([a,b])=>{const ya=y-6-(h-6)*a,yb=y-6-(h-6)*b,ia=(w/2-2)*(1-a)+w*.08*a,ib=(w/2-2)*(1-b)+w*.08*b;g.beginPath();g.moveTo(x+w/2-ia,ya);g.lineTo(x+w/2-ib,yb);g.lineTo(x+w/2+ib,yb);g.lineTo(x+w/2+ia,ya);g.fill()})}
 else if(o.type==='log'){gr=g.createLinearGradient(0,y-h,0,y);gr.addColorStop(0,'#9a6a3c');gr.addColorStop(.5,'#6e4523');gr.addColorStop(1,'#3e2610');g.fillStyle=gr;g.beginPath();g.roundRect(x,y-h,w-10,h,h/2);g.fill();g.strokeStyle='rgba(40,22,8,.5)';g.lineWidth=1.2;for(let i=1;i<4;i++){g.beginPath();g.moveTo(x+10+i*18,y-h+5);g.lineTo(x+22+i*18,y-h+9);g.stroke()}g.fillStyle='#d8b07a';g.beginPath();g.ellipse(x+w-12,y-h/2,9,h/2,0,0,6.29);g.fill();g.strokeStyle='#9c7442';g.lineWidth=1.3;[6,3.5].forEach(r=>{g.beginPath();g.ellipse(x+w-12,y-h/2,r*.9,r*1.6,0,0,6.29);g.stroke()})}
 else{const n=o.type==='tower'?2:1;for(let i=0;i<n;i++){const yy=y-50*i;gr=g.createLinearGradient(x,0,x+w,0);gr.addColorStop(0,'#c99a5b');gr.addColorStop(1,'#8f6534');g.fillStyle=gr;g.fillRect(x,yy-50,w,50);g.strokeStyle='#6a4520';g.lineWidth=3;g.strokeRect(x+1.5,yy-48.5,w-3,47);g.beginPath();g.moveTo(x+3,yy-3);g.lineTo(x+w-3,yy-47);g.stroke();g.fillStyle='rgba(255,240,200,.25)';g.fillRect(x+3,yy-48,w-6,4)}}}
function drawFly(g,f){const x=f.x,y=f.y+Math.sin(t*5+f.p)*6;
 const gl=g.createRadialGradient(x,y,0,x,y,22);gl.addColorStop(0,'rgba(240,255,170,.55)');gl.addColorStop(1,'rgba(240,255,170,0)');g.fillStyle=gl;g.beginPath();g.arc(x,y,22,0,6.29);g.fill();
 const fl=Math.sin(t*60+f.p)*.5+.5;g.fillStyle=`rgba(225,240,255,${.45+fl*.35})`;g.beginPath();g.ellipse(x-3,y-7,7,3.5,-.6-fl*.4,0,6.29);g.ellipse(x+3,y-7,7,3.5,.6+fl*.4,0,6.29);g.fill();
 g.fillStyle='#1d2420';g.beginPath();g.ellipse(x,y,6.5,4.5,0,0,6.29);g.fill();g.fillStyle='#8d1f1f';g.beginPath();g.arc(x+5,y-1,2.4,0,6.29);g.fill()}
function hearts(){return '♥'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,3-lives))}
const score=()=>Math.floor(meters)+fliesN*50;

function fillRidge(g,f,off,base,period,c1,c2){const gr=g.createLinearGradient(0,base-140,0,H);gr.addColorStop(0,rgb(c1));gr.addColorStop(1,rgb(c2));g.fillStyle=gr;g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=8)g.lineTo(x,base-f(x+off));g.lineTo(W,H);g.fill()}
const mod=(a,n)=>((a%n)+n)%n;

function drawTree(g,x,y,tr,dark){const h=tr.h;
 g.fillStyle=rgb(mix('#4a3320','#000000',dark*.3));g.fillRect(x-2.5,y-h*.35,5,h*.38);
 if(tr.t=='pine'){const base=mix('#2f5d2c','#1e4220',tr.c);for(let i=0;i<3;i++){const yy=y-h*.25-i*h*.22,w=h*(.38-i*.09);g.fillStyle=rgb(mix(base,'#0d1f0e',dark*.4));g.beginPath();g.moveTo(x-w,yy);g.lineTo(x,yy-h*.42);g.lineTo(x+w,yy);g.fill();g.fillStyle=rgb(mix(base,'#9cc46b',.18),.6);g.beginPath();g.moveTo(x-w*.2,yy-h*.05);g.lineTo(x,yy-h*.4);g.lineTo(x-w*.75,yy-1);g.fill()}}
 else{const base=mix('#4f8a2e','#3a6d25',tr.c);[[0,-.62,.36],[-.22,-.48,.28],[.22,-.5,.3]].forEach(([dx,dy,r])=>{const cx=x+dx*h,cy=y+dy*h,rr=r*h;const gr=g.createRadialGradient(cx-rr*.35,cy-rr*.4,rr*.1,cx,cy,rr);gr.addColorStop(0,rgb(mix(base,'#c4e48a',.35)));gr.addColorStop(1,rgb(mix(base,'#12260c',.45)));g.fillStyle=gr;g.beginPath();g.arc(cx,cy,rr,0,6.29);g.fill()})}}

/* ---------- frog and bike (local units, rear axle at 0,0) ---------- */
const R=[0,0],F=[132,0],BB=[56,-8],ST=[42,-62],HT=[112,-72],HB=[118,-48],HIP=[40,-64],L1=40,L2=38;
function tube(g,a,b,w,col){g.lineCap='round';g.strokeStyle=rgb(mix(col,'#000000',.25));g.lineWidth=w+1.5;g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke();g.strokeStyle=rgb(col);g.lineWidth=w;g.stroke();g.strokeStyle=rgb(mix(col,'#ffffff',.55),.8);g.lineWidth=w*.28;g.beginPath();g.moveTo(a[0],a[1]-w*.22);g.lineTo(b[0],b[1]-w*.22);g.stroke()}
function wheel(g,c,ang,v){const[x,y]=c;
 g.lineWidth=7;g.strokeStyle='#18181a';g.beginPath();g.arc(x,y,34,0,6.29);g.stroke();
 g.lineWidth=1;g.strokeStyle='rgba(255,255,255,.12)';g.beginPath();g.arc(x,y,36.5,3.6,5.6);g.stroke();
 g.lineWidth=3;const rim=g.createLinearGradient(x-30,y-30,x+30,y+30);rim.addColorStop(0,'#f2f4f7');rim.addColorStop(.5,'#8d939b');rim.addColorStop(1,'#d9dde2');g.strokeStyle=rim;g.beginPath();g.arc(x,y,30,0,6.29);g.stroke();
 const blur=Math.min(1,v/9);
 if(blur>.25){g.fillStyle=`rgba(200,205,212,${.12*blur})`;g.beginPath();g.arc(x,y,29,0,6.29);g.fill()}
 g.strokeStyle=`rgba(210,214,220,${1-blur*.75})`;g.lineWidth=.8;
 for(let i=0;i<16;i++){const a=ang+i*Math.PI/8;g.beginPath();g.moveTo(x+Math.cos(a+.2)*3,y+Math.sin(a+.2)*3);g.lineTo(x+Math.cos(a)*29,y+Math.sin(a)*29);g.stroke()}
 const hub=g.createRadialGradient(x-1.5,y-1.5,.5,x,y,5);hub.addColorStop(0,'#ffffff');hub.addColorStop(1,'#5b6068');g.fillStyle=hub;g.beginPath();g.arc(x,y,5,0,6.29);g.fill()}
function legIK(px,py){const dx=px-HIP[0],dy=py-HIP[1],d=Math.min(Math.hypot(dx,dy),L1+L2-.5),b=Math.atan2(dy,dx),a=Math.acos((L1*L1+d*d-L2*L2)/(2*L1*d)),th=b-a;return[HIP[0]+L1*Math.cos(th),HIP[1]+L1*Math.sin(th)]}
function leg(g,ang,near){const px=BB[0]+Math.cos(ang)*17,py=BB[1]+Math.sin(ang)*17,kn=legIK(px,py);
 const c1=near?'#5f9a2b':'#3f6e1c',c2=near?'#4c8222':'#335a17';
 g.lineCap='round';g.strokeStyle=rgb(hx(c1));g.lineWidth=13;g.beginPath();g.moveTo(...HIP);g.lineTo(...kn);g.stroke();
 g.strokeStyle=rgb(hx(c2));g.lineWidth=9;g.beginPath();g.moveTo(...kn);g.lineTo(px,py);g.stroke();
 if(near){g.strokeStyle='rgba(200,235,140,.45)';g.lineWidth=3;g.beginPath();g.moveTo(HIP[0]+2,HIP[1]-4);g.lineTo(kn[0],kn[1]-4);g.stroke()}
 g.fillStyle=rgb(hx(c2));for(let i=-1;i<=1;i++){g.beginPath();g.ellipse(px+6+i*1,py+1+i*3,7,2.6,i*.35,0,6.29);g.fill();g.fillStyle=rgb(hx(near?'#a7d266':'#5c8a2c'));g.beginPath();g.arc(px+12+i*1.5,py+1+i*3.8,2.2,0,6.29);g.fill();g.fillStyle=rgb(hx(c2))}
 return[px,py]}

function audio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}catch(e){return null}}
function tone(f,f2,dur,vol,type='sine',delay=0){const a=audio();if(!a)return;const t0=a.currentTime+delay,o=a.createOscillator(),gn=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);gn.gain.setValueAtTime(.0001,t0);gn.gain.exponentialRampToValueAtTime(vol,t0+.005);gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(gn).connect(a.destination);o.start(t0);o.stop(t0+dur+.02)}
function bell(){bellT=1.1;[0,.16,.32].forEach(d=>{tone(2350,0,.8,.14,'sine',d);tone(3120,0,.7,.06,'sine',d);tone(4700,0,.5,.025,'sine',d)})}
function hop(){tone(320,620,.12,.08,'triangle')}
function gulp(){tone(900,240,.12,.12,'square');tone(1400,1900,.08,.05,'sine',.1)}
function thud(){tone(140,50,.3,.3,'sawtooth');tone(90,40,.35,.25,'sine')}
function showOv(title,text,btn){ovTitle.textContent=title;ovText.textContent=text;go.textContent=btn;ov.hidden=false}
function start(){obs.length=0;items.length=0;pops.length=0;meters=0;fliesN=0;lives=3;inv=0;shake=0;slow=0;jumps=0;jy=0;jv=0;nextObs=700;nextItem=400;speed=5;mode=0;paused=false;game='play';ov.hidden=true;pauseBtn.textContent='暫停';if(document.activeElement===go)go.blur()}
function gameOver(){game='over';const s=score(),nb=s>best;if(nb){best=s;try{localStorage.setItem('guata-best',best)}catch(e){}}
 setTimeout(()=>showOv(nb?'新紀錄!':'摔車了!',`騎了 ${Math.floor(meters)} 公尺，吃到 ${fliesN} 隻蒼蠅，得分 ${s}。最高分 ${best}。`,'再騎一次'),700)}
function togglePause(){if(game!=='play')return;paused=!paused;pauseBtn.textContent=paused?'繼續':'暫停';if(paused)showOv('暫停中','準備好就繼續騎。','繼續');else{ov.hidden=true;if(document.activeElement===go)go.blur()}}
function jump(){if(game!=='play'){if(game==='ready'||(game==='over'&&!ov.hidden))start();return}
 if(paused){togglePause();return}
 if(jy===0&&jv===0){jv=-720;jumps=1;hop()}else if(jumps<2){jv=-640;jumps=2;hop()}}
go.addEventListener('click',e=>{e.stopPropagation();if(paused)togglePause();else start()});
$('jump').addEventListener('click',jump);
$('bell').addEventListener('click',bell);
pauseBtn.addEventListener('click',()=>{if(game==='play')togglePause()});
cv.addEventListener('pointerdown',e=>{e.preventDefault();jump()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&game==='play'&&!paused)togglePause()});
window.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&(e.code==='Space'||e.key==='Enter'))return;
 if(e.code==='Space'||e.key==='ArrowUp'||e.key==='w'||e.key==='W'){e.preventDefault();jump()}
 else if(e.key==='b'||e.key==='B')bell();
 else if(e.key==='p'||e.key==='P'||e.key==='Escape')togglePause()});
requestAnimationFrame(frame);
})();
</script>
